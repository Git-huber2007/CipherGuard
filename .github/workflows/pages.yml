# Build the static dashboard and publish it to GitHub Pages.
#
# The analysis runs here, in CI, on every push: the JSON under docs/data is
# regenerated by the real pipeline before it is published, so the hosted page
# cannot drift away from the code that produced it. A copy of docs/ is also
# committed, but it is not what this workflow deploys; publishing that copy would
# let the two disagree silently, which is the failure this whole project is
# about detecting elsewhere.

name: Deploy dashboard to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # The pinned versions, so a release of a dependency cannot change what
      # is tested between two runs of the same commit.
      - name: Install
        run: |
          pip install -r requirements.lock
          pip install -e ".[dev]"

      - name: Run the test suite
        run: pytest tests/ -q

      - name: Generate captures and train the model
        run: |
          cipherguard lab
          cipherguard train

      - name: Build the static dashboard
        run: cipherguard export-demo --out docs

      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
