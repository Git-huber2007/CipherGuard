<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#1b6e8c"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Outer Shield Background -->
  <path d="M 64 8 
           C 92 8, 114 18, 114 36 
           C 114 74, 94 104, 64 120 
           C 34 104, 14 74, 14 36 
           C 14 18, 36 8, 64 8 Z" 
        fill="url(#shieldGrad)" 
        stroke="url(#glowGrad)" 
        stroke-width="5" 
        filter="url(#glow)"/>

  <!-- Inner Tech Circuit Grid -->
  <path d="M 64 22 L 64 42 M 64 86 L 64 106 M 34 50 L 50 50 M 78 50 L 94 50" 
        stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.4"/>
  <circle cx="64" cy="42" r="3" fill="#38bdf8" opacity="0.8"/>
  <circle cx="64" cy="86" r="3" fill="#38bdf8" opacity="0.8"/>

  <!-- Wi-Fi / RF Arcs (Top half) -->
  <path d="M 44 48 A 26 26 0 0 1 84 48" fill="none" stroke="#38bdf8" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M 52 56 A 16 16 0 0 1 76 56" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>

  <!-- Center Lock & Keyhole (Cryptographic Security) -->
  <rect x="50" y="66" width="28" height="24" rx="4" fill="#0284c7" stroke="#e0f2fe" stroke-width="2"/>
  <path d="M 55 66 V 58 A 9 9 0 0 1 73 58 V 66" fill="none" stroke="#e0f2fe" stroke-width="3.5" stroke-linecap="round"/>
  <circle cx="64" cy="76" r="3" fill="#0f172a"/>
  <path d="M 64 77 L 64 84" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Posture Indicator Dot -->
  <circle cx="96" cy="28" r="6" fill="#10b981"/>
  <circle cx="96" cy="28" r="10" fill="none" stroke="#10b981" stroke-width="2" opacity="0.6"/>
</svg>
