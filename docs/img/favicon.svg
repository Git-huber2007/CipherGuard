<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16">
  <title>CipherGuard Wire Ribbon Logo Mark</title>
  <style>
    :root {
      --obs-color: #1b6e8c;
      --seam-color: #14212b;
      --inf-color: #6d4e9c;
      --hatch-color: #d8c7f0;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --obs-color: #2fa1c7;
        --seam-color: #101923;
        --inf-color: #845ec2;
        --hatch-color: #f0e6ff;
      }
    }
    .block-obs { fill: var(--obs-color, #1b6e8c); }
    .bar-seam  { fill: var(--seam-color, #14212b); }
    .block-inf { fill: var(--inf-color, #6d4e9c); }
    .hatch-ln  { stroke: var(--hatch-color, #d8c7f0); }
  </style>
  <defs>
    <!-- Ribbon outer boundary mask for smooth 2px corner radius -->
    <clipPath id="ribbon-mask">
      <rect x="1" y="2" width="14" height="12" rx="2" ry="2"/>
    </clipPath>
    <!-- Inferred block clipping to isolate hatching strictly to the ciphertext side -->
    <clipPath id="inf-mask">
      <rect x="9" y="2" width="6" height="12"/>
    </clipPath>
  </defs>
  <!-- Wire Ribbon Group -->
  <g clip-path="url(#ribbon-mask)">
    <!-- 1. Left: Teal block (observed cleartext) -->
    <rect class="block-obs" x="1" y="2" width="6" height="12" fill="#1b6e8c"/>

    <!-- 2. Right: Violet block (inferred ciphertext base) -->
    <rect class="block-inf" x="9" y="2" width="6" height="12" fill="#6d4e9c"/>

    <!-- 3. Violet diagonal hatch lines (ciphertext framing) -->
    <g clip-path="url(#inf-mask)" class="hatch-ln" stroke="#d8c7f0" stroke-width="1.1" stroke-linecap="square">
      <line x1="8" y1="6" x2="13" y2="1"/>
      <line x1="8" y1="9.5" x2="16" y2="1.5"/>
      <line x1="8" y1="13" x2="16" y2="5"/>
      <line x1="9.5" y1="15" x2="16" y2="8.5"/>
      <line x1="13" y1="15" x2="16" y2="12"/>
    </g>

    <!-- 4. Center: Thin dark key-boundary seam bar -->
    <rect class="bar-seam" x="7" y="2" width="2" height="12" fill="#14212b"/>
  </g>
  <!-- Subtle perimeter rim for tactile clarity and contrast on any browser chrome -->
  <rect x="1" y="2" width="14" height="12" rx="2" ry="2" fill="none" stroke="#14212b" stroke-width="0.8" opacity="0.35"/>
</svg>
